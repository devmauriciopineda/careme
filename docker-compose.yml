services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careme
      POSTGRES_USER: careme
      POSTGRES_PASSWORD: careme
    ports:
      - "5432:5432"
    volumes:
      - careme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careme -d careme"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    image: careme-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/careme
      CAREME_LLM_MODE: ${CAREME_LLM_MODE:-fake}
      CAREME_LLM_BASE_URL: ${CAREME_LLM_BASE_URL:-https://api.deepseek.com}
      CAREME_LLM_MODEL: ${CAREME_LLM_MODEL:-deepseek-flash}
      CAREME_LLM_API_KEY: ${CAREME_LLM_API_KEY:-}
      CAREME_LLM_CONNECT_TIMEOUT: ${CAREME_LLM_CONNECT_TIMEOUT:-PT5S}
      CAREME_LLM_READ_TIMEOUT: ${CAREME_LLM_READ_TIMEOUT:-PT30S}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    image: careme-frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side fetch runs inside the compose network.
      API_BASE_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  careme-pgdata:
