spring:
  application:
    name: careme-backend
  datasource:
    url: ${CAREME_DB_URL:jdbc:postgresql://localhost:5432/careme}
    username: ${CAREME_DB_USER:careme}
    password: ${CAREME_DB_PASSWORD:careme}
  jpa:
    # The Flyway migration owns the schema; Hibernate only checks that it matches.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # An import may carry a 10 MB file; the request adds the multipart overhead.
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

careme:
  cors:
    allowed-origins: http://localhost:3000
  events:
    # Directory holding the Markdown source of truth for clinical events. It must
    # be writable by the process user and outlive the container that runs it.
    directory: ${CAREME_EVENTS_DIRECTORY:data/events}
  llm:
    mode: ${CAREME_LLM_MODE:openai}
    base-url: ${CAREME_LLM_BASE_URL:https://api.deepseek.com}
    model: ${CAREME_LLM_MODEL:deepseek-flash}
    connect-timeout: ${CAREME_LLM_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${CAREME_LLM_READ_TIMEOUT:PT30S}
  chat:
    max-conversations: ${CAREME_CHAT_MAX_CONVERSATIONS:1000}
    ttl: ${CAREME_CHAT_TTL:PT2H}
    # Bounded buffer of the most recent turns, used only to interpret follow-up
    # questions while the conversation is active.
    max-recent-turns: ${CAREME_CHAT_MAX_RECENT_TURNS:6}
    query:
      # Maximum number of clinical events retrieved to answer one question.
      max-results: ${CAREME_CHAT_QUERY_MAX_RESULTS:10}
  import:
    # A file above this many data rows is rejected before anything is stored.
    max-rows: 10000
